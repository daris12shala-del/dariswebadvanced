<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Aroma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="wrap nav">
        <a class="logo" href="index.html">AROMA
            <span>PERFUMES</span>
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="men.html">Men</a>
            <a href="women.html">Women</a>
            <a href="notes.html">Notes</a>
            <a href="rreth-nesh.html">About</a>
            <a href="kontakt.html">Contact</a>
        </nav>
    </div>
</header>

<main>
    <section class="wrap intro">
        <span class="eyebrow">GET IN TOUCH</span>
        <h1>Contact Us</h1>
        <p>Have any questions? Feel free to contact us.</p>
    </section>

    <section class="wrap contact section">
        <div>
            <h2>Our Information</h2>
            <p>Location: Prishtina, Kosovo</p>
            <p>Email: AROMA@parfumes.com</p>
        </div>

        <form action="mailto:AROMA@parfumes.com"
              method="post"
              enctype="text/plain">

            <label for="name">Your Name</label>
            <input type="text" id="name"
                   name="Name" placeholder="Your name"
                   required>

            <label for="email">Email Address</label>
            <input type="email" id="email"
                   name="Email" placeholder="Your email"
                   required>

            <label for="message">Your Message</label>
            <textarea id="message" name="Message"
                      rows="5" required
                      placeholder="Write your message..."></textarea>

            <button type="submit" class="btn">
                Open Email App
            </button>

            <small>
                This form opens your email application.
            </small>
        </form>
    </section>
</main>

<footer>
    <div class="wrap">
        AROMA PERFUMES
        <span>Personal Project • 2026</span>
    </div>
</footer>

</body>
</html>
